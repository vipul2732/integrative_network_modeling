name: inm-py310
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy>=2.0.0
  - scipy>=1.10.0
  - pip
  - pip:
    # Core Bayesian Inference
    - numpyro>=0.18.0
    - arviz>=0.23.0
    
    # JAX (CPU version - for GPU, see setup instructions)
    - jax>=0.6.0
    - jaxlib>=0.6.0
    
    # Data Processing
    - pandas>=2.0.0
    
    # Visualization
    - matplotlib>=3.8.0
    - seaborn>=0.13.0
    
    # Network Analysis
    - networkx>=3.0
    
    # Excel I/O
    - openpyxl>=3.1.0
    
    # Configuration
    - pyyaml>=6.0
    
    # CLI Tools
    - click>=8.0
    
    # Community Detection
    - python-louvain>=0.16
    
    # Optional: Machine Learning
    - scikit-learn>=1.3.0
